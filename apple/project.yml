name: Stream
options:
  bundleIdPrefix: com.joeblau
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: K78G42H4U2    # Apple Developer Team ID for device builds
    TARGETED_DEVICE_FAMILY: "1,2"
    # RTCHaishinKit's libdatachannel xcframework ships no x86_64 simulator slice,
    # so the iOS simulator builds arm64-only (devices are arm64; CI is Apple Silicon).
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

packages:
  HaishinKit:
    # Vendored as a git submodule at Vendor/HaishinKit.swift, pinned to the
    # fork revision that keeps NWConnection alive across recoverable
    # `.waiting`/viability transitions (instead of dropping RTMPS during
    # ordinary app switches) and delivers ordered mixer output (2.2.5 can
    # reorder frames and then silently drop them as invalid RTMP timestamps).
    # Update by advancing the submodule pointer, not an SPM revision.
    path: Vendor/HaishinKit.swift
  Syphon:
    # C09 (issue #163): Syphon inter-app video, vendored as a prebuilt
    # xcframework with a local binary-target package (upstream ships no
    # Package.swift, so remote SPM resolution is impossible). See
    # Vendor/Syphon/Package.swift for the pinned commit and rebuild steps.
    path: Vendor/Syphon

targets:

  # ---------------------------------------------------------------
  # Shared dynamic framework for settings and storage. It intentionally has no
  # HaishinKit dependency: the publishing libraries must be loaded exactly once,
  # by the app target, or Objective-C/Swift runtime classes are duplicated.
  # ---------------------------------------------------------------
  StreamCore:
    type: framework
    platform: iOS
    sources:
      - StreamCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeblau.StreamCore
        GENERATE_INFOPLIST_FILE: YES
        # Pure Foundation/Security logic with no iOS-26/27 APIs. A low, stable
        # floor decouples this framework and its tests from the app's iOS 27
        # requirement, so CI can build and run the suite on whatever iOS
        # simulator the runner ships — not only an (unavailable) iOS 27 sim.
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        # The framework also builds for macOS (StreamMac). SDKROOT auto +
        # explicit SUPPORTED_PLATFORMS let one target serve both platforms;
        # the only version-gated API is NetworkPathSnapshot's iOS 26/macOS 26
        # link-quality probe, guarded by #available in source.
        SDKROOT: auto
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
      configs:
        # Lets StreamCoreTests use `@testable import StreamCore` to pin internal
        # cross-process contracts (e.g. the per-protocol Keychain account keys).
        Debug:
          ENABLE_TESTABILITY: YES
  # ---------------------------------------------------------------
  # Unit tests for the pure StreamCore logic (Swift Testing). Logic
  # tests — no host app — so `xcodebuild test` runs them on a sim.
  # ---------------------------------------------------------------
  StreamCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StreamCoreTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Match StreamCore's low floor so the suite runs on any iOS simulator.
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        # Same multi-platform setup as StreamCore so the suite also runs on
        # macOS (logic tests, no host app needed).
        SDKROOT: auto
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    dependencies:
      - target: StreamCore

  # ---------------------------------------------------------------
  # iOS application (SwiftUI)
  # ---------------------------------------------------------------
  Stream:
    type: application
    platform: iOS
    sources:
      - Stream
      # The publishers are process-agnostic. ScreenCaptureKit now runs them in
      # the host app instead of a ReplayKit broadcast upload extension.
      - StreamBroadcast/Publisher.swift
      - StreamBroadcast/RTMPPublisher.swift
      - StreamBroadcast/SessionPublisher.swift
      - StreamBroadcast/FacecamCapture.swift
      - StreamBroadcast/FacecamCompositor.swift
      - StreamBroadcast/LatestCameraFrame.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeblau.Stream
    info:
      path: Stream/Info.plist
      properties:
        CFBundleDisplayName: Stream
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UIUserInterfaceStyle: Dark
        UIStatusBarHidden: true
        NSCameraUsageDescription: Stream uses the camera for the optional facecam picture-in-picture overlay on your broadcast.
        NSMicrophoneUsageDescription: Stream uses the microphone (including connected Bluetooth mics) to capture audio for your broadcast.
        NSPhotoLibraryAddUsageDescription: Stream saves your local HD broadcast backups to Photos so you can repost them if a stream drops.
        NSScreenCaptureUsageDescription: Stream captures the screen and audio you choose so it can publish your live stream.
        # ScreenCaptureKit requires its dedicated background mode to continue
        # capturing after the picker sends this app to the background.
        UIBackgroundModes:
          - audio
          - screen-capture
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Stream/Stream.entitlements
      properties:
        # Keeps AVCaptureSession alive after full-display sharing moves Stream to
        # the background. This capability must also be enabled for the App ID in
        # the Apple Developer portal so its provisioning profile carries the key.
        com.apple.developer.avfoundation.multitasking-camera-access: true
        com.apple.security.application-groups:
          - group.com.joeblau.Stream
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.joeblau.Stream
    dependencies:
      - target: StreamCore
        embed: true
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
      - package: HaishinKit
        product: SRTHaishinKit
      - package: HaishinKit
        product: RTCHaishinKit

  # ---------------------------------------------------------------
  # macOS application (SwiftUI). Shares StreamCore with the iOS app and,
  # like it, links the HaishinKit products directly — the publishing
  # libraries must be loaded exactly once, into the app target only.
  # Swift 6 + strict concurrency come from the project base settings.
  # ---------------------------------------------------------------
  StreamMac:
    type: application
    platform: macOS
    sources:
      - StreamMac
      # The publishers + facecam pipeline are process-agnostic and shared with
      # the iOS app (FacecamCapture carries #if os(iOS) shims); the publishing
      # libraries must be loaded exactly once, into the app target only.
      - StreamBroadcast/Publisher.swift
      - StreamBroadcast/RTMPPublisher.swift
      - StreamBroadcast/SessionPublisher.swift
      - StreamBroadcast/FacecamCapture.swift
      - StreamBroadcast/FacecamCompositor.swift
      - StreamBroadcast/LatestCameraFrame.swift
      # Restream chat, shared with the iOS app (macOS-adapted).
      - Stream/RestreamChat.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeblau.StreamMac
        # Developer ID profiles authorize the existing App Group and Keychain claims.
        PROVISIONING_PROFILE_SPECIFIER: $(STREAM_MAC_PROVISIONING_PROFILE)
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # The project base carries iOS-only settings; they do not apply here.
        TARGETED_DEVICE_FAMILY: ""
        # C05 (issue #105): opt in to the explicit Continuity Camera device
        # type. Without this key continuity cameras report as
        # .builtInWideAngleCamera and a DiscoverySession asking for
        # .continuityCamera finds nothing.
        INFOPLIST_KEY_NSCameraUseContinuityCameraDeviceType: YES
        # Without usage descriptions macOS silently denies camera/mic prompts
        # (the sandbox entitlements alone are not enough).
        INFOPLIST_KEY_NSCameraUsageDescription: Stream uses your cameras (including iPhone via Continuity Camera) as live sources in your broadcast scenes.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Stream uses the microphone (including connected Bluetooth mics) to capture audio for your broadcast.
    info:
      path: StreamMac/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: Stream Show
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.joeblau.stream.show]
            LSTypeIsPackage: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.joeblau.stream.show
            UTTypeDescription: Stream Show Package
            UTTypeConformsTo: [com.apple.package, public.directory]
            UTTypeTagSpecification:
              public.filename-extension: [streamshow]
    entitlements:
      path: StreamMac/StreamMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # A11 (issue #123): host third-party Audio Unit effects in-process.
        # Enumerating components works sandboxed; LOADING a third-party AU
        # bundle into the process requires this documented temporary
        # exception (the GarageBand-class host entitlement). Sandbox stays
        # on; macOS has no out-of-process hosting for arbitrary v2 component
        # AUs, so crash containment is the error-handling ladder documented
        # in ChannelFXProcessor. Kept in sync with StreamMac.entitlements.
        com.apple.security.temporary-exception.audio-unit-host: true
        com.apple.security.device.camera: true
        com.apple.security.device.microphone: true
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        # A02 (issue #97) / P03 (issue #80): media file playout + the asset
        # library — the file picker grants access to user-picked files,
        # persisted across launches as app-scope security-scoped bookmarks.
        # Read-write (superseding A02's read-only) so linked references can
        # refresh stale bookmarks and support folders that receive writes.
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # Same App Group + keychain access group as the iOS app so settings
        # and stream credentials are shared via StreamCore's stores.
        com.apple.security.application-groups:
          - group.com.joeblau.Stream
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.joeblau.Stream
    dependencies:
      - target: StreamCore
        embed: true
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
      - package: HaishinKit
        product: SRTHaishinKit
      - package: HaishinKit
        product: RTCHaishinKit
      # C09 (issue #163): Syphon client (server discovery + Metal frame
      # receive). macOS-only — the iOS target never links it.
      - package: Syphon
        product: Syphon

# ---------------------------------------------------------------
# Shared scheme so `xcodegen generate` produces a deterministic,
# CLI/CI-buildable scheme (Xcode otherwise auto-creates a local one).
# ---------------------------------------------------------------
schemes:
  Stream:
    build:
      targets:
        Stream: all
        StreamCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StreamCoreTests
    archive:
      config: Release

  # ---------------------------------------------------------------
  # macOS app scheme (deterministic, CLI/CI-buildable like Stream's).
  # ---------------------------------------------------------------
  StreamMac:
    build:
      targets:
        StreamMac: all
        StreamCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StreamCoreTests
    archive:
      config: Release

  # ---------------------------------------------------------------
  # Tests-only scheme for CI. Builds just StreamCore + StreamCoreTests
  # (pure logic; no HaishinKit / ScreenCaptureKit), so it compiles on
  # GitHub runners that ship only the iOS 26 SDK. The full app target
  # needs the iOS 27 SDK (Xcode 27) and is verified on a physical
  # device — ScreenCaptureKit is device-only regardless.
  # ---------------------------------------------------------------
  StreamCoreTests:
    build:
      targets:
        StreamCoreTests: [test, build]
    test:
      config: Debug
      targets:
        - StreamCoreTests
