<!DOCTYPE html>
<!-- G07 (issue #114) fixture: a Streamlabs-style follow alert box.
     Transparent page background; one looping pop-in animation. The card is
     fixed-geometry (520x160, centered) so the harness can sample known
     transparent corners and the semi-transparent panel for alpha checks. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  #stage { position: relative; width: 100vw; height: 100vh; }
  #alert {
    position: absolute; left: 50%; top: 50%;
    width: 520px; height: 160px;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(18, 18, 42, 0.85);
    border: 3px solid rgba(120, 220, 255, 0.9);
    border-radius: 24px;
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.55);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: -apple-system, "Helvetica Neue", sans-serif; color: #fff;
    animation: pop 6s ease-in-out infinite;
  }
  #alert .title { font-size: 40px; font-weight: 700; letter-spacing: 1px; }
  #alert .name  { font-size: 28px; color: #8ee3ff; margin-top: 8px; }
  @keyframes pop {
    0%   { transform: translate(-50%, -50%) scale(0); }
    8%   { transform: translate(-50%, -50%) scale(1.12); }
    14%  { transform: translate(-50%, -50%) scale(1.0); }
    80%  { transform: translate(-50%, -50%) scale(1.0); }
    90%  { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="alert">
      <div class="title">NEW FOLLOWER</div>
      <div class="name" id="name">pixel_pioneer_42</div>
    </div>
  </div>
</body>
</html>
