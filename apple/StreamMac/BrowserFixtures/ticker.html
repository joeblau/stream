<!DOCTYPE html>
<!-- G07 (issue #114) fixture: DOM-driven invalidation — a chat ticker that
     JS updates at 10 Hz (textContent churn) inside a CSS-scrolling marquee.
     Exercises the script-to-paint path rather than pure CSS compositing.
     Transparent background; the ticker bar is a 60px strip pinned to the
     bottom, fixed geometry for the alpha probes. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  #ticker {
    position: absolute; left: 0; right: 0; bottom: 0; height: 60px;
    background: rgba(8, 8, 20, 0.78);
    border-top: 2px solid rgba(255, 200, 60, 0.85);
    display: flex; align-items: center;
    font-family: -apple-system, "Helvetica Neue", sans-serif;
    font-size: 26px; color: #ffd66e; white-space: nowrap; overflow: hidden;
  }
  #scroll { display: inline-block; padding-left: 100vw; animation: scroll 12s linear infinite; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-100%); } }
</style>
</head>
<body>
  <div id="ticker"><span id="scroll"><span id="text">LIVE CHAT</span></span></div>
  <script>
    const verbs = ["followed", "subscribed", "raided", "cheered", "gifted a sub to"];
    let tick = 0;
    setInterval(() => {
      tick += 1;
      const v = verbs[tick % verbs.length];
      document.getElementById("text").textContent =
        `user_${tick % 97} ${v}  •  message #${tick}  •  ${new Date().toLocaleTimeString()}`;
    }, 100);
  </script>
</body>
</html>
