<!DOCTYPE html>
<!-- G07 (issue #114) fixture: worst-case widget cost — an animated
     conic-gradient glow ring, a pulsing multi-layer box-shadow, and a
     backdrop-filter blur panel over a continuously repainting gradient.
     Everything moves every frame; there is no idle repaint. Transparent
     page background, fixed 640x360 geometry for the alpha probes. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  #stage { position: relative; width: 100vw; height: 100vh; }
  #halo {
    position: absolute; left: 50%; top: 50%;
    width: 640px; height: 360px; transform: translate(-50%, -50%);
    border-radius: 40px;
    background: conic-gradient(from 0deg, #ff0066, #ffee00, #00ffaa, #2299ff, #cc44ff, #ff0066);
    animation: spin 4s linear infinite;
    filter: blur(18px);
  }
  #panel {
    position: absolute; left: 50%; top: 50%;
    width: 600px; height: 320px; transform: translate(-50%, -50%);
    border-radius: 32px;
    background: rgba(10, 10, 24, 0.72);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    animation: pulse 2.5s ease-in-out infinite;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Helvetica Neue", sans-serif;
    font-size: 44px; font-weight: 800; color: #fff;
    text-shadow: 0 0 24px rgba(140, 220, 255, 0.9);
  }
  @keyframes spin { from { transform: translate(-50%, -50%) rotate(0deg); }
                    to   { transform: translate(-50%, -50%) rotate(360deg); } }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 30px rgba(255, 0, 128, 0.35); }
    50%      { box-shadow: 0 0 90px rgba(0, 200, 255, 0.65); }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="halo"></div>
    <div id="panel">SUB x5 — neon_nova</div>
  </div>
</body>
</html>
