name: Browser interview foundations
on:
  pull_request:
    paths:
      - 'workers/interviews/**'
      - '.github/workflows/interviews.yml'
  push:
    branches: [main]
    paths:
      - 'workers/interviews/**'
      - '.github/workflows/interviews.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: interviews-${{ github.ref }}
  cancel-in-progress: true
jobs:
  signaling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/interviews
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/interviews/package-lock.json
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm run typegen
      - run: git diff --exit-code -- worker-configuration.d.ts
      - run: npm run typecheck
      - run: node --check public/guest.js
      - run: npm test
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: workers/interviews
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/interviews/package-lock.json
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - name: Restore Chrome app bundle layout
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          CHROME_CONTENTS="$(dirname "$(dirname "$CHROME_BIN")")"
          test -f "$CHROME_CONTENTS/Info.plist"
          CHROME_APP="$RUNNER_TEMP/stream-chrome/Google Chrome for Testing.app"
          mkdir -p "$(dirname "$CHROME_APP")"
          ditto "$CHROME_CONTENTS" "$CHROME_APP/Contents"
          printf 'CHROME_BIN=%s\n' "$CHROME_APP/Contents/MacOS/Google Chrome for Testing" >> "$GITHUB_ENV"
      - run: node --check public/host.js
      - run: npm run test:client
      - run: npm run test:browser
        env:
          CHROME_NO_SANDBOX: '1'
