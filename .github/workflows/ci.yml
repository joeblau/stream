name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: StreamMac build and tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Show native toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers
          uname -m
      - name: Install XcodeGen
        run: brew install xcodegen cmake
      - name: Generate project
        run: xcodegen generate
      - name: Resolve and verify native transport implementations
        run: |
          xcodebuild -resolvePackageDependencies -project Stream.xcodeproj -scheme StreamMac \
            -derivedDataPath build/desktop -skipPackagePluginValidation
          python3 scripts/repair_desktop_transport_archives.py build/desktop
      - name: Build desktop studio
        run: |
          xcodebuild build -project Stream.xcodeproj -scheme StreamMac \
            -destination 'platform=macOS' -derivedDataPath build/desktop \
            CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation
      - name: Test shared desktop logic
        run: |
          xcodebuild test -project Stream.xcodeproj -scheme StreamCoreTests \
            -destination 'platform=macOS' -derivedDataPath build/tests \
            -resultBundlePath build/desktop-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation
      - name: Test native controller and automation boundaries
        run: |
          zsh scripts/run_studio_shortcuts_harness.zsh
          zsh scripts/run_show_macros_harness.zsh
          zsh scripts/run_studio_local_control_harness.zsh
          zsh scripts/run_studio_automation_harness.zsh
          zsh scripts/run_studio_virtual_camera_harness.zsh
          PROVIDERS_BUILD_PATH=build/tests zsh scripts/run_provider_accounts_harness.zsh
          SCHEDULING_BUILD_PATH=build/tests zsh scripts/run_provider_scheduling_harness.zsh
          CHAT_BUILD_PATH=build/tests zsh scripts/run_direct_chat_harness.zsh
          ENDING_BUILD_PATH=build/tests zsh scripts/run_studio_ending_harness.zsh
      - name: Qualify shared publishing encoders and bounded transport fanout
        run: SHARED_ENCODER_BUILD_PATH=build/desktop zsh scripts/run_shared_encoder_harness.zsh

      - name: Qualify local rehearsal preparation and cleanup
        run: REHEARSAL_BUILD_PATH=build/desktop zsh scripts/run_local_rehearsal_harness.zsh
      - name: Qualify local shortcut window and focus handling
        run: LOCAL_SHORTCUT_BUILD_PATH=build/desktop zsh scripts/run_local_shortcut_harness.zsh

      - name: Test private program slate rendering
        run: PRIVACY_BUILD_PATH=build/desktop zsh scripts/run_studio_privacy_harness.zsh
      - name: Qualify paired canvas rendering and recording
        run: DUAL_CANVAS_BUILD_PATH=build/desktop zsh scripts/run_studio_dual_canvas_harness.zsh
      - name: Test public chat and recovery metadata boundaries
        run: |
          zsh scripts/run_studio_chat_harness.zsh
          RECOVERY_BUILD_PATH=build/tests zsh scripts/run_session_recovery_harness.zsh
          REVIEW_BUILD_PATH=build/tests zsh scripts/run_recovery_event_review_harness.zsh
          REVIEW_ACCOUNTS_BUILD_PATH=build/tests zsh scripts/run_recovery_accounts_harness.zsh
          WORKSPACE_BUILD_PATH=build/desktop zsh scripts/run_studio_workspace_harness.zsh
      - name: Qualify recorded public chat timing
        run: CHAT_BUILD_PATH=build/desktop zsh scripts/run_recording_chat_harness.zsh
      - name: Qualify complete comment presentation and recorded pages
        run: COMMENT_BUILD_PATH=build/desktop zsh scripts/run_comment_presentation_harness.zsh

      - name: Qualify generated program recordings
        run: zsh scripts/run_program_recording_harness.zsh
      - name: Validate sandbox declaration
        run: python3 scripts/validate_desktop_distribution.py build/desktop/Build/Products/Debug/StreamMac.app
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.runner }}
          path: apple/build/desktop-tests.xcresult

  test:
    name: StreamCore tests (iOS Simulator)
    runs-on: macos-26
    defaults:
      run:
        working-directory: apple
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # The full Stream app requires the iOS 27 SDK (ScreenCaptureKit + the
      # AVAudioInputNode throwing-tap API), which GitHub runners do not ship
      # yet — the newest hosted Xcode (26.x) only carries the iOS 26 SDK. Until
      # runners gain Xcode 27, CI validates the pure StreamCore logic and its
      # test suite (both pinned to an iOS 18 floor in project.yml, so they build
      # and run on the runner's iOS 26 simulators). The app itself is verified
      # on a physical iOS 27 device.
      - name: Test StreamCore
        run: |
          xcodebuild test \
            -scheme StreamCoreTests \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation
