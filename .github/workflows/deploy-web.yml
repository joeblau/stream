name: Web

on:
  push:
    branches: [main]
    paths:
      - "workers/web/**"
      - ".github/workflows/deploy-web.yml"
  pull_request:
    paths:
      - "workers/web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Build and deploy blau-stream
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workers/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: workers/web/.nvmrc
          cache: npm
          cache-dependency-path: workers/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Cloudflare types
        run: npm run cf-typegen

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build Worker
        run: npm run build:worker

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run

      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID in repository Actions secrets or variables}"
          : "${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN in repository Actions secrets}"
          npx wrangler whoami
          npx opennextjs-cloudflare deploy
