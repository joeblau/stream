name: Native control row layout

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-control-rows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  owned-layout:
    name: Owned offscreen rows (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Name the native toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun swiftc --version
          uname -m
          if [[ "${{ matrix.runner }}" == "macos-26-intel" ]]; then
            test "$(uname -m)" = "x86_64"
          else
            test "$(uname -m)" = "arm64"
          fi
          test "$(sysctl -in sysctl.proc_translated || true)" != "1"
      - name: Check all owned native row and scroller cases
        working-directory: apple
        run: python3 scripts/test_studio_control_rows.py
      - name: Retain owned layout diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-rows-${{ matrix.runner }}
          retention-days: 7
          path: apple/build/studio-control-rows-validation/artifacts
