name: Stream
options:
  bundleIdPrefix: com.joeblau
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: K78G42H4U2    # Apple Developer Team ID for device builds
    TARGETED_DEVICE_FAMILY: "1,2"
    # RTCHaishinKit's libdatachannel xcframework ships no x86_64 simulator slice,
    # so the iOS simulator builds arm64-only (devices are arm64; CI is Apple Silicon).
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

packages:
  HaishinKit:
    url: https://github.com/HaishinKit/HaishinKit.swift
    # Includes ordered mixer-output delivery; 2.2.5 can reorder frames and then
    # silently drop them as invalid RTMP timestamp sequences.
    revision: 23838718b33aa68dfc71afd069ecb3277bfd12fa

targets:

  # ---------------------------------------------------------------
  # Shared dynamic framework (settings model + store; links HaishinKit core only)
  # ---------------------------------------------------------------
  StreamCore:
    type: framework
    platform: iOS
    sources:
      - StreamCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeblau.StreamCore
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: HaishinKit
        product: HaishinKit

  # ---------------------------------------------------------------
  # iOS application (SwiftUI)
  # ---------------------------------------------------------------
  Stream:
    type: application
    platform: iOS
    sources:
      - Stream
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeblau.Stream
    info:
      path: Stream/Info.plist
      properties:
        CFBundleDisplayName: Stream
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: Stream uses the camera for the optional facecam picture-in-picture overlay on your broadcast.
        NSMicrophoneUsageDescription: Stream uses the microphone (including connected Bluetooth mics) to capture audio for your broadcast.
        NSPhotoLibraryAddUsageDescription: Stream saves your local HD broadcast backups to Photos so you can repost them if a stream drops.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Stream/Stream.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.joeblau.Stream
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.joeblau.Stream
    dependencies:
      - target: StreamCore
        embed: true
      - target: StreamBroadcast
        embed: true

  # ---------------------------------------------------------------
  # ReplayKit broadcast upload extension
  # ---------------------------------------------------------------
  StreamBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - StreamBroadcast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeblau.Stream.Broadcast
    info:
      path: StreamBroadcast/Info.plist
      properties:
        CFBundleDisplayName: StreamBroadcast
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: Stream uses the camera for the optional facecam picture-in-picture overlay on your broadcast.
        NSMicrophoneUsageDescription: Stream uses the microphone (including connected Bluetooth mics) to capture audio for your broadcast.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          NSExtensionAttributes:
            RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: StreamBroadcast/StreamBroadcast.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.joeblau.Stream
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.joeblau.Stream
    dependencies:
      - target: StreamCore
        embed: false
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
      - package: HaishinKit
        product: SRTHaishinKit
      - package: HaishinKit
        product: RTCHaishinKit

# ---------------------------------------------------------------
# Shared scheme so `xcodegen generate` produces a deterministic,
# CLI/CI-buildable scheme (Xcode otherwise auto-creates a local one).
# ---------------------------------------------------------------
schemes:
  Stream:
    build:
      targets:
        Stream: all
    run:
      config: Debug
    archive:
      config: Release
